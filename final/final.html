<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final</title>
    <link rel="stylesheet" href="final.css">
</head>
<body>
    <div id="game-container">
        <div id="instructions">
            <h3>How to Play</h3>
            <ul>
                <li>Tap <strong>SPACE</strong> to gain power.</li>
                <li>Don't stay at <strong>100%</strong> or <strong>0%</strong> for too long or you'll trip!</li>
            </ul>
        </div>

        <div class="meter-label">
            Power Level
        </div>
        <div id="power-bar-container">
            <div id="power-bar-fill"></div>
        </div>

        <div class="meter-label">Distance to Jump</div>
        <div id="track-container">
            <div id="runner-icon">Running</div>
        </div>

        <p id="gameStateDisplay">Ready?</p>
        <button id="startGameButton" onclick="startGame()">
            Start Game
        </button>
        <button id="restartGameButton" onclick="restartGame()" disabled>
            Restart Game
        </button>
        <p id="volumeText">
            Current Volume: --
        </p>
    </div>
    <script src="final.js"></script>
</body>
</html>
