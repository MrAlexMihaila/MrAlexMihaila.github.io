<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final</title>
    <link rel="stylesheet" href="final.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="countdown-overlay">
            <div id="countdown-number">3</div>
        </div>

        <div class="stats-panel">
            <div class="stat-box">
                <label>Power</label>
                <div id="power-bar-container">
                    <div id="power-bar-fill"></div>
                </div>
            </div>
            <div class="stat-box">
                <div id="info-box"></div>
                <label>Track Progress</label>
                <div id="track-container">
                    <div id="runner-icon">🏃</div>
                    <div class="finish-line"></div>
                </div>
            </div>
        </div>

        <div class="ui-footer">
            <div id="volumeText">Volume: --</div>
            <div class="controls">
                <button id="startGameButton" onclick="beginCountdown()">Start Game</button>
                <button id="restartGameButton" onclick="restartGame()" disabled>Retry</button>
            </div>
        </div>

        <div id="instructions">
            <h3>How to Play</h3>
            <ul>
                <li>Tap <strong>SPACE</strong> to gain power.</li>
                <li>You lose power as you're running.</li>
                <li>Don't stay at <strong>100%</strong> or <strong>0%</strong> for too long or you'll trip!</li>
                <li>Your power at the jump point becomes your volume (0–100).</li>
            </ul>
        </div>
    </div>

    <audio id="crowd-audio" src="cheering.mp3" loop></audio>
    <audio id="crowd-boo-audio" src="crowdBoo.mp3" loop></audio>
    <audio id="celebrate-audio" src="celebration.mp3"></audio>

    <script src="final.js"></script>
</body>
</html>
